services:
  web:
    build:
      context: .
      target: web
    environment:
      HMI_DOMAIN: ${HMI_DOMAIN:?Configura un dominio HTTPS}
      HMI_USER: ${HMI_USER:?Configura el usuario web}
      HMI_PASSWORD_HASH: ${HMI_PASSWORD_HASH:?Configura el hash bcrypt}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [backend]
    restart: unless-stopped
  backend:
    image: pozoagua-runtime:local
    build:
      context: .
      target: runtime
    environment:
      IOT_API_HOST: 0.0.0.0
      IOT_DB_PATH: /data/telemetry.sqlite
      MQTT_URL: mqtt://broker:1883
    volumes:
      - telemetry:/data
    depends_on: [broker]
    restart: unless-stopped
  broker:
    image: pozoagua-runtime:local
    command: ["node", "--experimental-strip-types", "server/broker.ts"]
    environment:
      IOT_BROKER_HOST: 0.0.0.0
    restart: unless-stopped
  publisher:
    image: pozoagua-runtime:local
    command: ["node", "--experimental-strip-types", "server/publish.ts"]
    environment:
      MQTT_URL: mqtt://broker:1883
    depends_on: [broker]
    restart: unless-stopped

volumes:
  telemetry:
  caddy-data:
  caddy-config:
