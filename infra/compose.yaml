# Servicios de desarrollo de Hail.
#   docker compose -f infra/compose.yaml up -d            -> base de datos, Redis y broker
#   docker compose -f infra/compose.yaml --profile app up -> además, backend y worker de ingesta en contenedores
# Los puertos se publican solo en 127.0.0.1.
name: hail

services:
  db:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: hail
      POSTGRES_PASSWORD: hail
      POSTGRES_DB: hail
    ports:
      # 5433 en el equipo para no chocar con un PostgreSQL local (5432). Cámbialo con HAIL_DB_PORT.
      - "127.0.0.1:${HAIL_DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Por TCP: durante la inicialización la imagen levanta un servidor temporal solo por socket
      # local, así "healthy" significa que ya acepta conexiones de verdad.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U hail -d hail"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:${HAIL_MQTT_PORT:-1883}:1883"
    volumes:
      # mosquitto.conf + passwd y acl generados con `python manage.py mqtt_sync_auth`
      - ./mosquitto/config:/mosquitto/config:ro
      - mqtt-data:/mosquitto/data
    # Si aún no existen passwd/acl el broker no arranca; se reintenta hasta que los generes.
    restart: unless-stopped

  backend:
    profiles: ["app"]
    build: ../backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://hail:hail@db:5432/hail
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../backend:/app
    depends_on:
      db:
        condition: service_healthy

  ingest:
    profiles: ["app"]
    build: ../backend
    command: python manage.py ingest_mqtt
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://hail:hail@db:5432/hail
      HAIL_MQTT_URL: mqtt://mqtt:1883
    env_file:
      # Credenciales MQTT de la cuenta de ingesta (HAIL_MQTT_USERNAME / HAIL_MQTT_PASSWORD)
      - path: ../backend/.env
        required: false
    volumes:
      - ../backend:/app
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    restart: unless-stopped

volumes:
  db-data:
  mqtt-data:
