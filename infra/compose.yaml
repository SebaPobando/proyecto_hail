# Servicios de desarrollo de Hail.
#   docker compose -f infra/compose.yaml up -d            -> base de datos, Redis y broker
#   docker compose -f infra/compose.yaml --profile app up -> además, el backend en un contenedor
# Los puertos se publican solo en 127.0.0.1.
name: hail

services:
  db:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: hail
      POSTGRES_PASSWORD: hail
      POSTGRES_DB: hail
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hail -d hail"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data

  backend:
    profiles: ["app"]
    build: ../backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://hail:hail@db:5432/hail
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  mqtt-data:
