# Broker MQTT de Hail.
# Sin conexiones anónimas: cada dispositivo usa su propio usuario y solo puede
# publicar en su tópico. Los archivos passwd y acl los genera
#   python manage.py mqtt_sync_auth
# y se recargan sin reiniciar con
#   docker compose -f infra/compose.yaml kill -s SIGHUP mqtt
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout
